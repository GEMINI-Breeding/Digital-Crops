# Syn2Real cowpea generator configuration.
# Flat "key value" so the Python optimizer can write these mechanically.
# Values marked [CAL] are measured, not guessed -- see PHASE1_FINDINGS.md.

# ---- camera: Basler acA2500-20gc, PYTHON 5000, 12.44 x 9.83 mm, 12 mm lens ----
camera.resolution_x            2592
camera.resolution_y            2048
camera.hfov                    54.8      # [CAL] 2*atan(12.44/24)
camera.height                  1.64      # [CAL] measured mast height, was 1.58
camera.focal_plane_distance    1.10      # [CAL] measured working distance
camera.lens_diameter           0.0025
camera.samples                 100
# White balance is already applied upstream from the camera spectra (scene-
# independent). Leaving the camera set to "auto" applies it a SECOND time,
# which squares the per-channel gains and renders tan soil pink and green
# foliage grey. Verified: auto -> background R>B>G, off -> background R>G>B.
camera.white_balance           off
# Manual: the render emits scene radiance with no gain, and exposure is applied in post from the
# raw EXR by scripts/develop.py. Auto-exposure meters the whole frame, so the same leaf rendered
# differently depending on how much soil sat beside it -- synthetic foliage swung 27 L* across the
# germination range where the real imagery swings under 4. It also passed the soil brightness error
# (L* 78 against a real 39.6) straight into foliage appearance. Exposure variation is reintroduced
# deliberately in post with --gain-jitter instead.
camera.exposure                manual
# Auto-exposure target median luminance, drawn per scene. Helios' 0.18 default is middle grey and
# renders this canopy 5 L* units too bright. Real foliage lightness spans L* 39-57; a fixed value
# reproduces the centre with none of that spread, which the asymmetric objective penalises as an
# unreachable real mode. Centre 0.15 from the sweep, width set to bracket the real L* range.
# Inert while camera.exposure is manual; retained because it is the calibrated auto-exposure target
# should the auto path ever be used again.
camera.exposure_target_min     0.115
camera.exposure_target_max     0.185

# ---- leaf optics: PROSPECT via the leafoptics plugin ----
# [CAL] fitted through white balance -> CCM -> tone curve against real 2023-07-28
# foliage. Replaces the LI-COR measured library, whose reflectance carries a
# ~0.05 additive stray-light offset (R(680)=0.083 vs T(680)=0.011).
leaf.chlorophyll               47.5

# --- leaf-to-leaf colour variation via the nitrogen model ---------------------
# Off by default: with it off every leaf carries the single spectrum above, which is how every
# result before 2026-09-04 was produced. On, PlantArchitecture tracks per-leaf nitrogen and
# LeafOptics bins it into distinct PROSPECT spectra, so young (nitrogen-poor) leaves render paler
# and mature ones darker. Measured target: real foliage spans 9.0 units of CIELAB a* between its
# 10th and 90th percentiles on leaf-sized windows; the uniform-spectrum canopy spans 4.0.
#
# Cab = N_area * 100 * f_photosynthetic * N_to_Cab_coefficient = N_area * 20 at the defaults,
# so leaf.chlorophyll 47.5 corresponds to N_area 2.375 and the population MEDIAN is held near there
# by the rate -- the real and synthetic mean colours already agree and must not move.
#
# target 3.4 rather than the 4.2 that scored marginally best. The three candidates 3.4/3.8/4.2 were
# indistinguishable in the rendered images (L* spread 16.66/16.69/16.61, a* 4.16/4.24/4.25 -- all
# inside run-to-run noise), so the choice was made on physical grounds instead: 3.4 puts the oldest
# leaves at Cab 68, inside both the literature range for cowpea and the 10-80 range over which this
# project's own PROSPECT pigment fit was performed. 4.2 implies Cab 84, outside both.
#
# This lever moves LIGHTNESS, not chroma. Chlorophyll explains ~6% of pixel a* variance in a canopy
# (illumination dominates), and the fitted colour matrix inverts the sign of what remains: off the
# sensor more chlorophyll reads greener (-0.26), after the matrix it reads less green (+0.24). The
# real canopy's leaf-patch a* spread of 8.7 against this build's 4.3 is an open problem that needs a
# different mechanism -- see scripts/chroma_stages.py.
leaf.nitrogen_model            1
leaf.target_N_area             3.4       # mature-leaf nitrogen, g N/m2  -> Cab 68
leaf.minimum_N_area            2.0       # -> Cab 40, the palest leaf the canopy may contain.
                                         # PlantArchitecture starts leaves created during growth at
                                         # ZERO nitrogen, so without this floor the youngest render
                                         # at zero chlorophyll: measured through this camera, hue
                                         # falls to 115 deg below Cab 20 while every real leaf patch
                                         # including the palest sits at 123. At 2.0 the palest render
                                         # at hue ~123 and the median is unchanged at Cab 47.6; 2.5
                                         # would be greener still but drags the median to 50.
leaf.initial_N_area            1.0
leaf.nitrogen_supply_gN        8.0       # available pool per plant. Sized to be NON-limiting:
                                         # at 0.83 m2 of leaf per plant and target 4.2 the canopy
                                         # demands ~4.1 gN/plant, so 8.0 leaves ~2x headroom. When
                                         # this is short, no leaf reaches target and target_N_area
                                         # and max_N_accumulation_rate both become inert -- the
                                         # DIAG supply_ratio line reports it; below 1.0 is a bug.
leaf.root_N_allocation         0.15
leaf.max_N_accumulation_rate   0.14      # g N/m2/day; the cap is what keeps young leaves pale.
                                         # This sets the MEDIAN: a leaf holds min(target, rate*age),
                                         # and the canopy's age distribution is skewed young, so the
                                         # median leaf sits well below target. 0.14 puts median Cab
                                         # at 47.6, matching the 47.5 the uniform path used, so the
                                         # canopy's average colour is unchanged and only the spread
                                         # is new. Measured: within-tile L* spread 13.6 -> 16.7
                                         # against a real 15.8.
leaf.remobilization_efficiency 0.70
leaf.remobilization_age_threshold 0.70
leaf.f_photosynthetic          0.50
leaf.N_to_Cab_coefficient      0.40
leaf.nitrogen_bins             20
leaf.carotenoid                14.6
leaf.anthocyanin               6.5
leaf.numberlayers              1.92
leaf.watermass                 0.0149
leaf.drymass                   0.0076
# [CAL] High-resolution scanned leaf meshes (~1,600 triangles/leaflet with an
# alpha cut-out texture), as used by the baseline dataset. Scene primitive count
# rises 1.7M -> 14.7M and render time roughly doubles; set to 0 for fast sweeps
# where only aggregate statistics matter, but 1 for anything compared visually
# against the baseline set.
leaf.use_obj_mesh              1
# [CAL] Reduced from 0.25. Measured on TILES (an earlier sweep measured full
# frames, where bright soil masked the effect): 0.25 -> 9.4% of pixels above
# L=76 against a real 4.6%; 0.05 -> 3.3%; 0.12 -> 6.1%. 0.08 sits on target.
leaf.specular_scale            0.08
leaf.specular_exponent         35

# ---- canopy ----
canopy.age                     40        # [CAL] gives canopy top 0.525 m vs real 0.54 m (working distance 1.115 vs 1.10)
# [CAL] Reduced from 0.6. At the corrected 1280-native tile footprint (563 mm of
# ground) a 0.6 m row gap means many tiles straddle bare inter-row soil, holding
# cover at 0.91 against a real 0.97. Raising germination did not help -- the
# limit is row geometry, not plant count.
# 0.35 m closed the canopy so uniformly that every candidate tile sat at 0.998
# cover and the selector had no spread to sample; real tiles run 0.78-0.99.
canopy.plant_spacing_x         0.45
# [CAL] Row count, germination and in-row spacing set frame-level canopy cover.
# Measured sweep at age 40 (canopy top stays 0.52-0.55 m throughout -- density
# and height are independent, no competition is modelled):
#     rows=2 germ=0.7 sy=0.13 -> 0.63    rows=3 germ=0.7 sy=0.13 -> 0.80
#     rows=4 germ=0.7 sy=0.13 -> 0.82    rows=3 germ=1.0 sy=0.13 -> 0.89
#     rows=3 germ=1.0 sy=0.09 -> 0.93    rows=4 germ=1.0 sy=0.09 -> 0.93
# Real FULL-FRAME cover is 0.838 (2023-07-28) and 0.912 (2023-08-28) -- only two
# usable samples, so this is a centre to randomize about, not a value to pin.
# Suggested generation ranges: rows 3-4, germination 0.60-1.00, spacing_y 0.09-0.13.
canopy.rows                    4
canopy.plant_spacing_y         0.09
# Drawn per scene, with bounds set from EXACT ground masks written by the renderer rather than from
# a colour classifier. That distinction matters: this soil renders green (a* -6 against a real +2),
# so Excess Green counted it as canopy and reported 0.98 cover on a frame whose true canopy is 0.30.
# Every earlier germination calibration was flat for that reason alone.
#
# Measured against the exact masks, cover runs 0.297 / 0.651 / 0.929 / 0.991 at germination
# 0.10 / 0.30 / 0.60 / 0.90. The real distribution is p5 0.568, median 0.947, p95 0.984, so this
# range spans it: 0.25 reaches the sparse tail and 0.85 the dense one.
# ---- soil ----
# [CAL] Soil reflectance was never scaled, so it rendered ~4.5x too bright. Measured against exact
# ground masks with foliage exposed to the real median L* of 48.4, synthetic soil sat at L* 75.7
# against a real 39.6 -- brighter than the foliage, where real soil is darker than it. Solving on
# raw radiance, which is linear in reflectance, puts the match at 0.22.
#
# This error was invisible for two reasons: auto-exposure partly absorbed it by stopping the frame
# down, and every vegetation mask counted the pale soil as canopy so it never entered a statistic.
soil.reflectance_scale         0.22

canopy.germination_fraction_min 0.25
canopy.germination_fraction_max 0.85
canopy.bed_size_x              1.524
canopy.bed_size_y              1.524
canopy.plot_size_x             1.524
canopy.plot_size_y             3.048
canopy.n_cheeseweed            3
canopy.n_bindweed              1
canopy.n_puncturevine          0

# ---- inflorescence ----
# [CAL] pitch was forced to a flat 90 deg, which made every bud stand erect and
# skewed synthetic box log-aspect to -0.615 against a real +0.041. The library
# default range is restored so buds point in varied directions.
# Random azimuth per plant. The library never randomizes a plant's overall orientation, so the
# whole plot faced within ~40 deg of one direction: 92% of rendered open-flower boxes came out
# taller than wide against a real 46/54 split.
canopy.random_plant_yaw        1

# ---- leaf geometry ----
# Library default is uniform(0.09, 0.12) m leaflet length. Leaf-scale granulometry (disc radii out
# to 121 px, which is where a leaflet actually lives) puts synthetic canopy structure at a mean
# radius of 30.7 px against a real 37.8 px. The earlier 1-41 px range saturated below leaf scale
# and reported a match that was not there.
leaf.prototype_scale_min       0.10
leaf.prototype_scale_max       0.16

flower.inflorescence_pitch_min 40
flower.inflorescence_pitch_max 60
# [CAL] Back to the library value, which is also the botanical one: a cowpea
# corolla is about 3 cm. It had been doubled to 0.06 to lift a median box size,
# but that median was taken over a bimodal mixture of open flowers and closed
# buds and was never a valid summary of either. Measured per class in the
# rasterized geometry pass over 8 seeds, open-flower boxes run 32.9 px at 0.030,
# 44.1 px at 0.040 and 68.4 px at 0.060, against a real 33.5 px.
flower.prototype_scale         0.030
# Bud mesh size relative to the open corolla. The two share flower_prototype_scale and the closed
# mesh is 0.47 of the open one in prototype units, so a correctly-sized 30 mm corolla comes with a
# 14 mm bud. The real annotations put that ratio at 0.91, and a 14 mm bud falls below the
# annotator's own 23.4 px visibility floor, so every bud was being filtered out of the export.
flower.closed_scale            1.9
flower.bud_break_prob_min      0.10
flower.bud_break_prob_max      0.15
# [CAL] Reduced from 1-3. Two or three blooms on one peduncle sit within a few
# centimetres, which halved the nearest-neighbour spacing between flowers:
# 41.8 px against a real 83.3 with the count and size otherwise matching.
flower.flowers_per_peduncle_min 1
flower.flowers_per_peduncle_max 1
flower.flower_offset            0.05
flower.peduncle_length_min     0.30
flower.peduncle_length_max     0.35
flower.fruit_set_probability   0.4
flower.open_fraction           0.7
flower.white_flower_prob       0.3

# ---- lighting ----
light.flux_scale               1.0
light.side_ratio               0.2
light.sun_flux                 3.0
light.scattering_depth         2
# [CAL] Source SIZE controls shadow hardness; flux does not. The rig's six
# 0.1x0.08 m emitters at 1.6 m are near-point sources and cast hard shadows
# (19.7% of pixels below L=10 vs a real 0.6%). Scattering depth 2->8 changed
# NOTHING (leaves absorb too strongly in the visible for later bounces to
# matter) and side_ratio changed nothing either. source_scale 2.0 with a small
# diffuse fill is the colour-optimal point: G/B 2.42 vs a real 2.43.
# [CAL] Reverted from 2.0. Enlarging the emitters softened shadows but inflated
# the specular response well past the real imagery. Real emitter size restored.
light.source_scale             1.0
light.diffuse_flux             0.10

# ---- output ----
output.folder                  ../frames/
output.images_per_plot         1

# ---- camera colour transform ----
# Solved from the SpyderCHECKR frame captured 7.6 min before the 2023-07-28
# session. Stands in for the ISP colour-correction stage Helios does not model.
# White balance, applied ONCE and illuminant-aware, before the colour matrix.
# Helios' own is response-curve-only (ignores the illuminant) and was applied
# twice; switching it off took it to zero, which fed the matrix raw signal ~1.6x
# too green and collapsed its blue row. Factors are computed at runtime from the
# source spectrum and camera responses: R 1.563, G 1.000, B 1.596.
post.white_balance             1
post.ccm_file                  ../calib/ccm_camA_scenefit.xml
                                         # Fitted against scene foliage and soil colour, not the
                                         # colour board. The board matrix it replaces put foliage
                                         # hue at 117.2 against a real 123.5 and over-saturated
                                         # vegetation by 0.16; this lands hue 123.3, a* and b* exact.
                                         # It costs soil b* (-3 -> -8 error): a 3x3 cannot serve
                                         # foliage and soil at once. The develop gain that pairs
                                         # with it is camera_pipeline.DEVELOP_GAIN = 648.7.
# [EMPIRICAL, not calibrated] Blend of the measured matrix toward identity. At
# full strength it overshoots on tiles (saturation 0.66 vs a real 0.52, G/B 3.14
# vs 2.20); 0.75 lands saturation at 0.518 and G/B at 2.15. The matrix itself is
# the camera's own and is not in question -- the overshoot means the render's
# PRE-correction colour still differs from what the real camera saw, and this
# knob compensates for that rather than fixing it. Residual: foliage hue 78 deg
# against a real 85, i.e. still slightly yellow of the field.
# [CAL] 0.75 -> 1.00. The damping was empirical, introduced because the matrix "overshot" at full
# strength. It was compensating for the auto-exposure target being too bright: with exposure
# corrected, the camera's own measured matrix is right at full strength, which is what it should be.
# Joint sweep on dumped raw radiance, mean error over C*, C* p90, a*, foliage L* and whole-image L*:
# 9.9% at (0.18, 0.75) against 3.6% at (0.15, 1.00).
post.ccm_strength              1.00

# ---- phenology ----
# [CAL] The library flowers at day 40 and only reaches realistic flower density
# by ~day 75, where the canopy is 0.75 m against a real 0.54 m -- the model grows
# too tall relative to when it flowers. Advancing initiation reconciles them.
# Sweep at age 40 (boxes per 648x512 frame; real field-equivalent ~100/frame):
#   init=12 -> 87 boxes, leaf canopy 0.56 m, flower tips 0.645 m
#   init=18 -> 41 boxes    init=24 -> 12 boxes    init=30 -> 0 boxes
# Randomize over 12-20 when generating, to span flower density.
# [CAL] Raised from 14. Flower density had been tuned against 640-native tiles;
# at the correct 1280->640 scale each tile covers 4x the ground, and density was
# 3.4x too high (25.8 boxes/tile against a real 7.6). Another pair of errors that
# had been cancelling.
# Compensates for flowers_per_peduncle dropping 1-3 -> 1, which cut the count
# ~2.5x on its own. The two set flower density jointly and must move together.
# Interpolated: init 18 -> 12.7 boxes/tile, init 26 -> 2.5, target 7.6.
phenology.time_to_flower_initiation  19
# [CAL] 5 -> 3. With the bud correctly sized it survives the export filter, so bud lifetime now
# moves the exported label distribution; swept against elongation, which is better determined than
# the open/closed mixture fraction. |log aspect| 0.334 at 3 days against a real 0.304 (0.388 at 5,
# 0.242 at 2). Values below 3 are quantized away by the growth step: 1 and 2 render identically.
phenology.time_to_flower_opening      3
phenology.time_to_fruit_set           5
phenology.time_to_fruit_maturity     30
phenology.time_to_dormancy         1000

# ---- tone ----
# [CAL] The CCM's negative off-diagonals drive dark pixels below zero, where
# lin_to_srgb clamps to pure black. Measured before the fix: 2.19% pure-black and
# 2.28% clipped-white pixels vs 0.00%/0.09% in the real set. A real sensor has a
# black-level offset and noise floor and cannot produce a true zero.
# Sweep result: black_level 0.035 -> L p05 = 22.7 (real 22.6); knee 0.55 -> 0.00%
# clipped highlights.
# [CAL] Disabled. The lift was introduced to repair shadows crushed by the
# colour matrix clamping; the white-balance fix removed that clamping, so the
# lift became pure harm -- it left the frame with essentially no dark pixels
# (0.1% below L=20 against a real 3.4%) and read as washed out. Off: p05 24,
# %L<20 3.2, both matching real.
post.black_level               0.000
post.highlight_knee            0.55
post.contrast                  1.0

# ---- scene ----
# [CAL] The T4 rover body. Dropped in an earlier rewrite of main.cpp and
# restored: it occludes part of the upper hemisphere and shades the plot, and
# photometric parameters tuned without it are not valid with it.
scene.load_rover               1

# Raw radiance is now the primary render product: the dataset JPEGs are developed from it.
output.write_exr                1
