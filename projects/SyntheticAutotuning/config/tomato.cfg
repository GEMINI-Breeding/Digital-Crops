# Tomato configuration of the SyntheticAutotuning twin (block C, step 2, 2026-09-29).
#
# canopy.species tomato loads the Helios plant-library tomato model (PlantLibrary.cpp initializeTomatoShoots /
# buildTomatoPlant): one "mainstem" shoot type that also serves as its own child shoot type, a compound leaf of 7
# leaflets per petiole (leaflet offset 0.15, leaflet scale 0.7), the library's TomatoFlowerPrototype and
# TomatoFruitPrototype OBJ organs on a peduncle ("truss"), and TomatoPhytomerCreationFunction (no flowers below node 8
# of the main stem, leaf and internode scale ramping with plant age). In the label maps the flowers are class 2 (open)
# and 3 (closed), and the fruit class 5 like the cowpea pod. The cowpea-only settings of configurePlantModel (scanned
# leaflet OBJ, custom flower prototype, cowpea phenology, 0.002 m petiole radius) do not apply; a key below overrides
# the library only when it is present.
#
# Library values the file does not restate (they apply because their keys are absent): leaf aspect ratio 0.5, midrib
# fold 0.1, longitudinal curvature U(-0.45, -0.2), lateral curvature -0.3, leaflet size U(0.12, 0.18) m, petiole
# length 0.2 m, petiole pitch U(45, 60) deg, petiole curvature U(-150, -50) deg/m, leaf pitch U(-30, 5) deg,
# phyllotactic angle U(140, 220) deg, internode pitch 10 deg, insertion angle 30 deg, gravitropic curvature 150 deg/m,
# tortuosity 3, elongation rate 0.1, peduncle radius 1.5 mm, inflorescence pitch 80 deg, flower offset 0.15.
#
# Two camera variants. The active one is the synthetic benchmark scene (dataset/multicrop_eval_1387/tomato: 720 px
# generic pinhole, nadir at about 5 m, sun-lit, one plant, no rover); the fit and render scripts pass each scene's
# camera height and field of view as overrides. The TomatoWUR variant (real potted plants, 15 calibrated views, no
# rover, no soil map) is the override block at the end of the file.

canopy.species                 tomato

# ---- camera: synthetic benchmark scene (generic 720 px pinhole, nadir) ----
camera.resolution_x            720
camera.resolution_y            720
camera.hfov                    8.2       # 2 atan(sensor_width / 2 / focal_length) of nadir_camera.json; 4.8-8.6 deg per scene
camera.height                  5.0       # nadir_camera.json acquisition_properties.camera_height_m (5.0-5.5 m per scene)
camera.focal_plane_distance    5.0
camera.lens_diameter           0.0
camera.samples                 100
camera.white_balance           off
camera.exposure                auto
camera.exposure_target_min     0.15
camera.exposure_target_max     0.15

# ---- leaf optics ----
# leaf.optics cowpea: the PROSPECT parameters fitted to cowpea (baseline.cfg). Per-species optics are a decision pending
# with Heesup; silhouettes and label maps do not depend on it.
leaf.optics                    cowpea
leaf.chlorophyll               47.5
leaf.nitrogen_model            0
leaf.carotenoid                14.6
leaf.anthocyanin               6.5
leaf.numberlayers              1.92
leaf.watermass                 0.0149
leaf.drymass                   0.0076
leaf.use_obj_mesh              0         # the scanned leaflet meshes are cowpea's; tomato keeps its library leaflet
leaf.specular_scale            0.08
leaf.specular_exponent         35

# ---- plant model: the library tomato ----
# The benchmark's library start (benchmark/grass_bulk_fit.py DEFAULTS["tomato"]) is the library plant with the means of
# params_tomato.json: internode 0.04 m, 16 nodes, vegetative bud break 0.25, leaf aspect 0.5, petiole pitch 50 deg,
# gravitropic curvature 150 deg/m, longitudinal curvature -0.325. The twin starts from the same plant. The generator's
# per-plant multipliers (internode length, leaf scale, petiole length and radius, internode radius, fruit scale), its
# leaf yaw and roll, and the benchmark genotypes (compact 0.03 m / 12 nodes, tall 0.05 m / 20 nodes) have no twin key
# beyond the ones below; the genotype enters only through canopy.internode_length_max and canopy.max_nodes.
canopy.internode_length_max    0.04
canopy.phyllochron             2.0
canopy.max_nodes               16
canopy.bud_break_probability   0.25
canopy.bud_break_decay         -0.25
canopy.bud_break_time          30
canopy.gravitropic_curvature   150
canopy.tortuosity              3
canopy.insertion_angle_tip     30
canopy.elongation_rate         0.10
leaf.petiole_pitch_min         50
leaf.petiole_pitch_max         50
leaf.longitudinal_curvature_min -0.325
leaf.longitudinal_curvature_max -0.325

# ---- flower / fruit: the library truss ----
flower.peduncle_length_min     0.18
flower.peduncle_length_max     0.18
flower.peduncle_pitch          20
flower.peduncle_curvature      -900
flower.flowers_per_peduncle_min 6
flower.flowers_per_peduncle_max 6
flower.flower_offset           0.15
flower.prototype_scale         0.05
fruit.prototype_scale          0.15
flower.bud_break_prob_min      0.2
flower.bud_break_prob_max      0.2
flower.fruit_set_probability   0.8
flower.white_flower_prob       0.0       # only the render's flower spectra draw reads it (tomato flower color: see the record)

# ---- phenology: buildTomatoPlant (flower initiation 40 d, opening 5 d, fruit set 5 d, maturity 30 d) ----
phenology.time_to_flower_initiation 40
phenology.time_to_flower_opening    5
phenology.time_to_fruit_set         5
phenology.time_to_fruit_maturity    30
phenology.time_to_dormancy          1000

# ---- canopy: one plant per scene (the layout file places it); rows for a field stand ----
canopy.age                     45        # days after planting; the fit sets each plant's own age
canopy.rows                    1
canopy.plant_spacing_x         1.50      # row spacing (twin/species.py); single rows, 1.5 m beds
canopy.plant_spacing_y         0.45      # in-row spacing
canopy.bed_size_x              1.524
canopy.bed_size_y              1.524
canopy.germination_fraction_min 1.0
canopy.germination_fraction_max 1.0
canopy.random_plant_yaw        1
canopy.per_plant_seed          1
canopy.n_cheeseweed            0
canopy.n_bindweed              0
canopy.n_puncturevine          0

# ---- soil ----
soil.reflectance_scale         0.22

# ---- lighting: sun, as the synthetic scenes (no lamp rig) ----
light.flux_scale               0
light.side_ratio               0
light.sun_flux                 1.0
light.sun_spectrum             solar_spectrum_ASTMG173
light.scattering_depth         2
light.source_scale             1.0
light.diffuse_flux             0.15      # the twin's collimated source points at (0.2, 0, 0.9), 77 deg elevation; the scenes use 85
light.periodic_boundary        0

# ---- camera color transform: none (a generic camera, not the T4 Basler) ----
post.white_balance             0
post.ccm_strength              0.0
post.black_level               0.000
post.highlight_knee            1.0
post.contrast                  1.0

# ---- scene ----
scene.load_rover               0
scene.ground_size_x            12
scene.ground_size_y            12

# ---- output ----
output.folder                  ../frames/
output.images_per_plot         1
output.write_exr               0

# ---- TomatoWUR variant (real potted plants, 4TU TomatoWUR), passed as overrides ----
# Camera: the calibrated view of scratch/20260928_tomato/wur/wur_common.camera(cam) (1080 x 1920, principal point
# centered, downsampled by 4 to 270 x 480; hfov from fx, about 38.7 deg horizontally for cam 0). The input view (cam 0)
# looks about 37 deg down, so it is given as a full pose rather than a nadir height:
# camera.resolution_x 270  camera.resolution_y 480  camera.hfov <2 atan(W / 2 / fx)>
# camera.pose <eye_x,eye_y,eye_z,x_x,x_y,x_z,y_x,y_y,y_z,z_x,z_y,z_z>   (eye and the camera's right, up and backward
#                                                                        axes in the twin frame, i.e. the TomatoWUR world
#                                                                        shifted so the labeled stem base is the origin)
# scene.load_rover 0   (no rover)   no scene.soil_albedo_map (no soil map: the plant stands in a pot on a turntable)
# raster.ground 0      (the label image has no ground class; everything but the plant is background)
# canopy.rows 1  canopy.germination_fraction_min 1  canopy.germination_fraction_max 1  (the layout file places the plant)
