# Sorghum configuration of the SyntheticAutotuning twin (block C, 2026-09-29).
#
# canopy.species sorghum loads the Helios plant-library sorghum model (PlantLibrary.cpp initializeSorghumShoots /
# buildSorghumPlant): one "mainstem" shoot type, a strap leaf per node, the procedural panicle as the fruit organ,
# the library's own phenology (fruit set 4 d, maturity 35 d, no flower stage). The cowpea-only settings of
# configurePlantModel (scanned leaflet OBJ, custom flower prototype, cowpea phenology, 0.002 m petiole radius) do
# not apply; a shoot key below overrides the library only when it is present.
#
# Library values the file does not restate (they apply because their keys are absent): phyllochron 3.5 d,
# max_nodes 16, leaf prototype scale 0.65 m, leaf aspect ratio 0.15, midrib fold 0.45, longitudinal curvature
# U(-0.07, -0.04), lateral curvature -0.3, sheath (petiole) pitch U(-25, -12) deg, phyllotactic angle U(155, 205) deg,
# gravitropic curvature U(-700, -200) deg/m, panicle scale 0.18, no lateral bud break.
#
# Two variants. The default below is the T4 rover rig (real sorghum plots of the 2023 multi-crop package, same
# Basler camera, lamp rig and rover body as cowpea). The synthetic-scene variant (dataset/multicrop_eval_1387/
# sorghum: 720 px generic pinhole, nadir camera at 5 m, sun-lit, one plant, no rover) is the same file with the
# override block listed at the end, which the fit and render scripts pass as key/value overrides.

canopy.species                 sorghum

# ---- camera: T4 rover, Basler acA2500-20gc (as baseline.cfg) ----
camera.resolution_x            2592
camera.resolution_y            2048
camera.hfov                    71.884    # calibrated fx 1787.6 px across 2592 px (twin/real.py HFOV_DEG)
camera.height                  1.55      # mast height 1.554 m (preparation record, real sorghum frames)
camera.focal_plane_distance    1.10
camera.lens_diameter           0.0025
camera.samples                 100
camera.white_balance           off
camera.exposure                manual
camera.exposure_target_min     0.115
camera.exposure_target_max     0.185

# ---- leaf optics ----
# leaf.optics cowpea: the PROSPECT parameters fitted to cowpea (baseline.cfg). Per-species optics (the Helios library
# spectra or a sorghum PROSPECT fit) are a decision for Heesup; silhouettes and label maps do not depend on it.
leaf.optics                    cowpea
leaf.chlorophyll               47.5
leaf.nitrogen_model            0
leaf.carotenoid                14.6
leaf.anthocyanin               6.5
leaf.numberlayers              1.92
leaf.watermass                 0.0149
leaf.drymass                   0.0076
leaf.use_obj_mesh              0         # the scanned leaflet meshes are cowpea's; sorghum keeps its library leaf
leaf.specular_scale            0.08
leaf.specular_exponent         35

# ---- plant model: the generator's sorghum (params_sorghum.json means, "tall" genotype) ----
# The benchmark's library start (benchmark/grass_bulk_fit.py DEFAULTS["sorghum"]) is the library plant with the
# species config's means: internode 0.28 m ("tall"; "dwarf" is 0.16), leaf aspect 0.19, midrib fold 0.30,
# longitudinal curvature -0.3, sheath pitch -30 deg, gravitropic curvature -350 deg/m. The twin starts from the same
# plant. The config's per-plant multipliers (internode, leaf scale, sheath length and radius, fruit scale) and its leaf
# yaw and roll ranges have no twin key; they stay at the library's values. The preparation record notes this plant
# is taller than field sorghum (4.5 m at DAP 60); the T4 plots need their own internode prior before a real fit.
canopy.internode_length_max    0.28
canopy.gravitropic_curvature   -350
canopy.tortuosity              5
canopy.insertion_angle_tip     45
canopy.elongation_rate         0.10
canopy.internode_pitch         2.5
leaf.aspect_ratio              0.19
leaf.midrib_fold_fraction      0.30
leaf.longitudinal_curvature_min -0.3
leaf.longitudinal_curvature_max -0.3
leaf.petiole_pitch_min         -30
leaf.petiole_pitch_max         -30

# ---- canopy: T4 sorghum plots ----
canopy.age                     40        # days after planting; the fit sets each plant's own age
canopy.rows                    2
canopy.plant_spacing_x         0.73      # row spacing, 0.59-0.79 m measured on the six plots (0.73 on 2023-06-27 S73-P1)
canopy.plant_spacing_y         0.10      # in-row spacing: assumed, not measured (sowing record not available)
canopy.bed_size_x              1.524
canopy.bed_size_y              1.524
canopy.germination_fraction_min 0.6
canopy.germination_fraction_max 0.9
canopy.random_plant_yaw        1
canopy.n_cheeseweed            0
canopy.n_bindweed              0
canopy.n_puncturevine          0

# ---- flower / fruit ----
# Sorghum has no flower prototype; the panicle is the fruit organ (class 5 in the label maps). Only the render's
# flower spectra draw reads this key.
flower.white_flower_prob       0.0

# ---- soil ----
soil.reflectance_scale         0.22

# ---- lighting: T4 lamp rig (as baseline.cfg) ----
light.flux_scale               1.0
light.side_ratio               0.2
light.sun_flux                 3.0
light.scattering_depth         2
light.source_scale             1.0
light.diffuse_flux             0.10

# ---- camera colour transform (as baseline.cfg) ----
post.white_balance             1
post.ccm_file                  ../calib/ccm_camA_scenefit.xml
post.ccm_strength              1.00
post.black_level               0.000
post.highlight_knee            0.55
post.contrast                  1.0

# ---- scene ----
scene.load_rover               1

# ---- output ----
output.folder                  ../frames/
output.images_per_plot         1
output.write_exr               0

# ---- synthetic-scene variant (dataset/multicrop_eval_1387/sorghum), passed as overrides ----
# camera.resolution_x 720  camera.resolution_y 720
# camera.height <nadir_camera.json acquisition_properties.camera_height_m>   (5.0-6.5 m, per scene)
# camera.hfov <2 atan(sensor_width / 2 / focal_length) from nadir_camera.json> (about 8.6 deg at 5.2 m)
# camera.focal_plane_distance <camera.height>
# camera.exposure auto  post.white_balance 0
# scene.load_rover 0  light.periodic_boundary 0  scene.ground_size_x 12  scene.ground_size_y 12
# light.flux_scale 0  light.side_ratio 0  light.sun_flux 1.0  light.sun_spectrum solar_spectrum_ASTMG173
# light.diffuse_flux 0.15      (the twin's collimated source points at (0.2, 0, 0.9), 77 deg elevation; the scenes use 85)
# canopy.rows 1  canopy.per_plant_seed 1  (the layout file places the one plant)
