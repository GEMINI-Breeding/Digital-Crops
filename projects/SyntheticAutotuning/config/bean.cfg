# Bean configuration of the SyntheticAutotuning twin (block C, 2026-09-30).
#
# canopy.species bean loads the Helios plant-library bean model (PlantLibrary.cpp initializeBeanShoots /
# buildBeanPlant). It is built like the library cowpea: a one-node "unifoliate" base shoot (two simple leaves) carrying
# the "trifoliate" main stem, whose shoot parameters the keys below override; a trifoliate leaf of 3 textured
# procedural leaflets (BeanLeaf_*.png, leaflet offset 0.3, leaflet scale 0.9); the library's BeanFlowerPrototype and
# BeanFruitPrototype (the pod) on a short peduncle; BeanPhytomerCreationFunction. In the label maps the flowers are
# class 2 (open) and 3 (closed), and the pod class 5 like the cowpea pod. The cowpea-only settings of
# configurePlantModel (scanned leaflet OBJ, custom cowpea flower prototype, cowpea phenology, 0.002 m petiole radius)
# do not apply; a key below overrides the library only when it is present, and only on the trifoliate shoot type (the
# unifoliate base leaves keep the library's values).
#
# Library values the file does not restate (they apply because their keys are absent): phyllochron 2 d, leaflet size
# U(0.09, 0.11) m, leaf aspect ratio 1.0, midrib fold 0.2, lateral curvature -1.0, petiole length U(0.10, 0.14) m,
# petiole radius 1.5 mm, phyllotactic angle U(145, 215) deg, leaf yaw 10 deg, bud break time 15 d and decay -0.4 per
# node, peduncle 0.04 m at U(0, 40) deg, 1-4 flowers per peduncle, flower offset 0.2, inflorescence pitch U(50, 70) deg,
# flower scale 0.03, pod scale U(0.15, 0.20), phenology 40 / 5 / 5 / 30 d (buildBeanPlant).
#
# Two camera variants. The active one is the synthetic benchmark scene (dataset/multicrop_eval_1387/bean: 720 px
# generic pinhole, nadir at about 5 m, sun-lit, one plant, no rover); the fit and render scripts pass each scene's
# camera height and field of view as overrides. The T4 rover variant (Basler camera, lamp rig and rover body, as
# baseline.cfg) is the override block at the end of the file.

canopy.species                 bean

# ---- camera: synthetic benchmark scene (generic 720 px pinhole, nadir) ----
camera.resolution_x            720
camera.resolution_y            720
camera.hfov                    7.0       # 2 atan(sensor_width / 2 / focal_length) of nadir_camera.json; 1.9-13.3 deg per scene (the camera frames the plant)
camera.height                  5.0       # nadir_camera.json acquisition_properties.camera_height_m (5.1-5.4 m per scene)
camera.focal_plane_distance    5.0
camera.lens_diameter           0.0
camera.samples                 100
camera.white_balance           off
camera.exposure                auto
camera.exposure_target_min     0.15
camera.exposure_target_max     0.15

# ---- leaf optics ----
# leaf.optics cowpea: the PROSPECT parameters fitted to cowpea (baseline.cfg). Per-species optics are a decision pending
# with Heesup; silhouettes and label maps do not depend on it.
leaf.optics                    cowpea
leaf.chlorophyll               47.5
leaf.nitrogen_model            0
leaf.carotenoid                14.6
leaf.anthocyanin               6.5
leaf.numberlayers              1.92
leaf.watermass                 0.0149
leaf.drymass                   0.0076
leaf.use_obj_mesh              0         # the scanned leaflet meshes are cowpea's; bean keeps its library leaflet
leaf.specular_scale            0.08
leaf.specular_exponent         35

# ---- plant model: the library bean with the means of params_bean.json ----
# The Digital-Crops generator grows the benchmark's bean plants from params_bean.json, which draws one value per plant
# for the keys below; the twin starts from their means. The generator's genotype sets internode length and node count
# (bush / erect 0.03 m and 9 nodes, spreading 0.045 m and 10, vine 0.06 m and 12; the benchmark scenes cycle through
# the three, and params_bean.json's own default is "erect"); the twin takes the middle one, spreading. The generator's
# leaf pitch is one value per plant, so the twin's leaf pitch is its mean with no spread. Keys with no twin equivalent
# stay at the library's values: the per-plant multipliers of leaflet size, petiole length and radius, internode radius
# and pod size (means 1.025-1.05), and the leaf yaw (mean 0 against the library's 10 deg).
canopy.internode_length_max    0.045     # genotype "spreading" (library 0.025)
canopy.max_nodes               10        # genotype "spreading" (library 25)
canopy.phyllochron             2.0
canopy.bud_break_probability   0.35      # U(0.1, 0.6) (library 0.1)
canopy.gravitropic_curvature   -350      # U(-800, 100) deg/m (library 200)
canopy.tortuosity              5         # U(0, 10)
canopy.insertion_angle_tip     45        # U(25, 65) deg (library U(40, 60))
canopy.elongation_rate         0.10      # U(0.05, 0.15)
canopy.internode_pitch         12.5      # U(0, 25) deg (library 20)
leaf.pitch_mean                15        # U(-15, 45) deg per plant (library N(0, 20) per leaf)
leaf.pitch_std                 0.0001
leaf.roll_min                  0         # U(-20, 20) deg (library -15)
leaf.roll_max                  0
leaf.petiole_pitch_min         35        # U(25, 45) deg (library U(20, 50))
leaf.petiole_pitch_max         35
leaf.petiole_curvature_min     0         # U(-150, 150) deg/m (library U(-100, 200))
leaf.petiole_curvature_max     0
leaf.longitudinal_curvature_min -0.25    # U(-0.4, -0.1) (library U(-0.3, -0.2))
leaf.longitudinal_curvature_max -0.25

# ---- flower / pod: the library inflorescence ----
flower.bud_break_prob_min      0.45      # U(0.1, 0.8) (library U(0.3, 0.4))
flower.bud_break_prob_max      0.45
flower.fruit_set_probability   0.75      # U(0.5, 1.0) (library 0.4)
flower.white_flower_prob       0.0       # only the render's flower spectra draw reads it

# ---- phenology: buildBeanPlant (flower initiation 40 d, opening 5 d, fruit set 5 d, maturity 30 d) ----
phenology.time_to_flower_initiation 40
phenology.time_to_flower_opening    5
phenology.time_to_fruit_set         5
phenology.time_to_fruit_maturity    30
phenology.time_to_dormancy          1000

# ---- canopy: one plant per scene (the layout file places it); rows for a field stand ----
canopy.age                     40        # days after planting; the fit sets each plant's own age
canopy.rows                    1
canopy.plant_spacing_x         0.76      # row spacing (twin/species.py): the 30 in beds of the T4 field, as cowpea
canopy.plant_spacing_y         0.10      # in-row spacing: assumed, not measured
canopy.bed_size_x              1.524
canopy.bed_size_y              1.524
canopy.germination_fraction_min 1.0
canopy.germination_fraction_max 1.0
canopy.random_plant_yaw        1
canopy.per_plant_seed          1
canopy.n_cheeseweed            0
canopy.n_bindweed              0
canopy.n_puncturevine          0

# ---- soil ----
soil.reflectance_scale         0.22

# ---- lighting: sun, as the synthetic scenes (no lamp rig) ----
light.flux_scale               0
light.side_ratio               0
light.sun_flux                 1.0
light.sun_spectrum             solar_spectrum_ASTMG173
light.scattering_depth         2
light.source_scale             1.0
light.diffuse_flux             0.15      # the twin's collimated source points at (0.2, 0, 0.9), 77 deg elevation; the scenes use 85
light.periodic_boundary        0

# ---- camera color transform: none (a generic camera, not the T4 Basler) ----
post.white_balance             0
post.ccm_strength              0.0
post.black_level               0.000
post.highlight_knee            1.0
post.contrast                  1.0

# ---- scene ----
scene.load_rover               0
scene.ground_size_x            12
scene.ground_size_y            12

# ---- output ----
output.folder                  ../frames/
output.images_per_plot         1
output.write_exr               0

# ---- T4 rover variant (real bean plots of the 2023 multi-crop package), passed as overrides ----
# The same Basler camera, lamp rig and rover body as cowpea (baseline.cfg):
# camera.resolution_x 2592  camera.resolution_y 2048  camera.hfov 54.8  camera.height 1.64
# camera.focal_plane_distance 1.10  camera.lens_diameter 0.0025  camera.exposure manual
# camera.exposure_target_min 0.115  camera.exposure_target_max 0.185
# light.flux_scale 1.0  light.side_ratio 0.2  light.sun_flux 3.0  light.diffuse_flux 0.10
# post.white_balance 1  post.ccm_file ../calib/ccm_camA_scenefit.xml  post.ccm_strength 1.00  post.highlight_knee 0.55
# scene.load_rover 1
# canopy.rows 2  canopy.germination_fraction_min 0.6  canopy.germination_fraction_max 0.9
